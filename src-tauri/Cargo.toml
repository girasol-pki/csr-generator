[package]
name = "girasol-csr-generator"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "girasol_csr_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-shell = "=2.6.0"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
openssl = { version = "=0.10.82", features = ["vendored"] }
cryptoki = "=0.12.1"
yasna = { version = "=0.6.0", features = ["bit-vec", "num-bigint"] }
bit-vec = "=0.9.1"
num-bigint = "=0.4.6"
