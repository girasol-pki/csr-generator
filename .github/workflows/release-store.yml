# Publica en la Microsoft Store al pushear un tag vX.Y.Z (igual a la versión de tauri.conf.json).
#
# Repo público, así que:
# - Actions fijadas por SHA de commit (un tag se puede mover); el comentario indica la versión.
# - Sin disparadores de pull_request: un fork no puede ejecutar esto ni leer secrets.
# - `build` no tiene secrets y es el único job que ejecuta código de dependencias
#   (scripts de pnpm, build scripts de Cargo). `publish` tiene los secrets, pero solo sube el
#   MSIX ya armado.
# - Los secrets viven en el environment `microsoft-store`, restringido a tags v* y con
#   aprobación manual antes de publicar.
name: Publicar en Microsoft Store

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: microsoft-store-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar que el tag coincide con la versión
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "El tag $env:GITHUB_REF_NAME no coincide con la versión $version de tauri.conf.json"
          }

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Instalar Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      - name: Tests de Rust
        working-directory: src-tauri
        run: cargo test --lib --locked

      # OpenSSL vendored se compila con el Strawberry Perl que trae la imagen de Windows.
      - run: pnpm tauri build --no-bundle

      - name: Empaquetar MSIX
        shell: pwsh
        run: ./src-tauri/msix/build-msix.ps1 -OutDir out/msix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix
          path: out/msix/*.msix
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    environment: microsoft-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix
          path: msix

      - uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4

      - name: Publicar
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure falló ($LASTEXITCODE)" }
          $msix = Get-ChildItem msix -Filter *.msix | Select-Object -First 1
          # --noCommit deja el envío en borrador: se revisa y se envía desde Partner Center.
          # Quitarlo cuando el primer envío por CI haya pasado certificación.
          msstore publish $msix.FullName --appId $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish falló ($LASTEXITCODE)" }
