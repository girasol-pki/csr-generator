# Publica en la Microsoft Store al pushear un tag vX.Y.Z (igual a la versión de package.json).
#
# Repo público, así que:
# - Actions fijadas por SHA de commit (un tag se puede mover); el comentario indica la versión.
# - Sin disparadores de pull_request: un fork no puede ejecutar esto ni leer secrets.
# - `build` no tiene secrets y es el único job que ejecuta código de dependencias
#   (scripts de pnpm, build scripts de Cargo). `publish` tiene los secrets, pero solo sube el
#   MSIX ya armado.
# - Los secrets viven en el environment `microsoft-store`, restringido a tags v* y con
#   aprobación manual antes de publicar.
name: Publicar en Microsoft Store

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: microsoft-store-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar que el tag coincide con la versión
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "El tag $env:GITHUB_REF_NAME no coincide con la versión $version de package.json"
          }

      - uses: ./.github/actions/setup

      # --release reutiliza lo que compila después `tauri build` (y la caché que deja el CI de main).
      - name: Tests de Rust
        working-directory: src-tauri
        run: cargo test --release --lib --locked

      # OpenSSL vendored se compila con el Strawberry Perl que trae la imagen de Windows.
      - run: pnpm tauri build --no-bundle

      - name: Empaquetar MSIX
        shell: pwsh
        run: ./src-tauri/msix/build-msix.ps1 -OutDir out/msix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix
          path: |
            out/msix/*.msix
            out/msix/release-notes.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    environment: microsoft-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix
          path: msix

      - uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4

      - name: Publicar
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
          # Variable del repo (no secret): 'true' envía a certificación; si no, queda en borrador.
          AUTO_SUBMIT: ${{ vars.MSSTORE_AUTO_SUBMIT }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure falló ($LASTEXITCODE)" }

          $msix = Get-ChildItem msix -Filter *.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish falló ($LASTEXITCODE)" }

          # `submission update` reemplaza el envío completo: se trae el borrador entero y solo se
          # cambian las notas de versión de cada idioma. Node (preinstalado) y no ConvertFrom-Json,
          # que convierte las fechas y alteraría campos que no tocamos.
          $current = Join-Path $env:RUNNER_TEMP "submission.json"
          $updated = Join-Path $env:RUNNER_TEMP "submission-updated.json"
          msstore submission get $env:PRODUCT_ID > $current
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get falló ($LASTEXITCODE)" }

          $script = Join-Path $env:RUNNER_TEMP "set-release-notes.cjs"
          Set-Content -Path $script -Encoding utf8NoBOM -Value @'
          const fs = require("fs");
          const [currentPath, notesPath, outPath] = process.argv.slice(2);
          const submission = JSON.parse(fs.readFileSync(currentPath, "utf8").replace(/^\uFEFF/, ""));
          const notes = fs.readFileSync(notesPath, "utf8");
          const keyOf = (obj, name) => Object.keys(obj).find((k) => k.toLowerCase() === name.toLowerCase());
          const listingsKey = keyOf(submission, "listings");
          if (!listingsKey || Object.keys(submission[listingsKey]).length === 0) throw new Error("El envío no tiene listings.");
          for (const listing of Object.values(submission[listingsKey])) {
            const baseKey = keyOf(listing, "baseListing");
            if (!baseKey) throw new Error("Un listing no tiene baseListing.");
            listing[baseKey][keyOf(listing[baseKey], "releaseNotes") ?? "releaseNotes"] = notes;
          }
          fs.writeFileSync(outPath, JSON.stringify(submission));
          console.log(`Notas de versión aplicadas a: ${Object.keys(submission[listingsKey]).join(", ")}`);
          '@
          node $script $current msix/release-notes.txt $updated
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron aplicar las notas de versión" }

          msstore submission update $env:PRODUCT_ID $updated
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update falló ($LASTEXITCODE)" }

          if ($env:AUTO_SUBMIT -eq "true") {
            msstore submission publish $env:PRODUCT_ID
            if ($LASTEXITCODE -ne 0) { throw "msstore submission publish falló ($LASTEXITCODE)" }
          } else {
            Write-Output "Envío en borrador: revísalo y envíalo desde Partner Center (MSSTORE_AUTO_SUBMIT no es 'true')."
          }
