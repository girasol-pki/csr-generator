name: Preparar entorno
description: pnpm, Node, Rust, caché de Cargo y dependencias JS. Compartido por CI y release para que usen la misma caché.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 11.28.11

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.1
        cache: pnpm

    - name: Instalar Rust
      shell: pwsh
      run: |
        rustup toolchain install 1.99.1 --profile minimal
        rustup default 1.99.1

    # Las cachés de un tag solo las ve ese tag; el CI de main la guarda para que los tags la lean.
    # restore-keys parte de la caché anterior cuando cambia Cargo.lock en vez de compilar desde cero.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          src-tauri/target
        key: cargo-${{ runner.os }}-1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-1.99.1-

    - shell: pwsh
      run: pnpm install --frozen-lockfile
